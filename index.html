<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEDE8;color:#121212;font-family:Onest,system-ui,sans-serif}
a{color:#121212}a:hover{color:#B83A0E}
*{box-sizing:border-box}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.disp{font-family:Onest,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.eb{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.eb.acc{color:#B83A0E}
.h2{margin:0;font-family:Onest,sans-serif;font-weight:800;font-size:clamp(32px,4.6vw,60px);line-height:1;letter-spacing:-.025em}
.lead{margin:0;font-size:17px;line-height:1.55;color:#3D3D39;max-width:680px}
.sec{display:flex;flex-direction:column;gap:28px;padding-top:28px;border-top:1.5px solid #121212}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border:1.5px solid #121212;background:transparent;color:#121212;font:600 14px Onest,sans-serif;cursor:pointer;border-radius:0}
.chip:hover{background:#E2E2DC}
.chip.on{background:#121212;color:#EDEDE8}
.tab{min-height:48px;padding:0 18px;border:0;border-bottom:3px solid transparent;background:transparent;color:#5A5A55;font:700 15px Onest,sans-serif;cursor:pointer}
.tab:hover{color:#121212}
.tab.on{color:#121212;border-bottom-color:#FF4D17}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;background:#121212;color:#EDEDE8;text-decoration:none;font-weight:700;font-size:16px;border:1.5px solid #121212}
.btn:hover{background:#FF4D17;border-color:#FF4D17;color:#121212}
.btn.ghost{background:transparent;color:#121212}
.btn.ghost:hover{background:#121212;color:#EDEDE8}
.tick{overflow:hidden;background:#121212;color:#EDEDE8;border-block:1.5px solid #121212}
.tick-in{display:flex;width:max-content;animation:tick 48s linear infinite}
.tick-in span{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;padding:14px 22px;white-space:nowrap}
.tick-in b{color:#FF4D17;font-weight:600}
@keyframes tick{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1.5px solid #121212}
.stat{display:flex;flex-direction:column;gap:10px;padding:24px 20px 24px 0}
.stat+.stat{padding-left:20px;border-left:1px solid #C9C9C1}
.stat .v{font-family:Onest,sans-serif;font-weight:800;font-size:clamp(34px,3.8vw,54px);line-height:1;letter-spacing:-.03em}
.stat .v small{font-size:.42em;letter-spacing:0;margin-left:4px}
.stat .l{font-size:14px;line-height:1.4;color:#3D3D39}
.stat.acc .v{color:#FF4D17;-webkit-text-stroke:1.5px #121212}
.li{display:flex;gap:12px;font-size:15px;line-height:1.5}
.li b{font-family:"IBM Plex Mono",monospace;color:#B83A0E;font-weight:600;flex:none}
.sel{height:44px;min-width:200px;padding:0 12px;border:1.5px solid #121212;background:#EDEDE8;font:600 14px Onest,sans-serif;color:#121212;border-radius:0}
.flt{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#5A5A55;font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em}
.mpc{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;font:600 12px Onest,sans-serif;border-radius:999px;white-space:nowrap}
.mp-WB{background:#A0179C;color:#FFFFFF}
.mp-OZ{background:#005BFF;color:#FFFFFF}
.mp-YM{background:#FFCC00;color:#121212}
.mp-ALI{background:#D6261E;color:#FFFFFF}
.mp-MM{background:#7B2FD9;color:#FFFFFF}
.mp-KAS{background:#C8251B;color:#FFFFFF}
.mp-LAM{background:#121212;color:#FFFFFF}
.mp-GA{background:#121212;color:#E8C66A}

/* кейсы */
.ct{min-width:1040px;border-top:1.5px solid #121212}
.cg{display:grid;grid-template-columns:96px 1fr 1.25fr 1.25fr 1.5fr 1.1fr 1.1fr 84px 44px;gap:14px;align-items:center}
.chd{padding:10px 0;border-bottom:1.5px solid #121212;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:#5A5A55;text-transform:uppercase;letter-spacing:.05em}
.cr{width:100%;min-height:60px;padding:10px 0;border:0;border-bottom:1px solid #C9C9C1;background:transparent;color:#121212;font:500 14px Onest,sans-serif;text-align:left;cursor:pointer;line-height:1.3}
.cr:hover{background:#E2E2DC}
.cr.on{background:#E2E2DC;border-bottom-color:transparent}
.cr.dim{opacity:.3}
.cr .yr{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;padding-left:10px}
.cr .co{font-family:Onest,sans-serif;font-weight:800;font-size:16px;letter-spacing:-.01em}
.cr .sm{font-size:13px;color:#3D3D39}
.cr .pa{font-family:"IBM Plex Mono",monospace;font-size:13px;color:#5A5A55}
.cr .pb{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.cr .tg{width:32px;height:32px;border:1.5px solid #121212;display:flex;align-items:center;justify-content:center;font:700 18px Onest,sans-serif;transition:transform .2s}
.cr:hover .tg{background:#121212;color:#EDEDE8}
.cr.on .tg{background:#FF4D17;transform:rotate(45deg)}
.cmp{display:flex;flex-wrap:wrap;gap:4px}
.cx{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2fr);gap:32px;padding:24px 20px 28px;background:#E2E2DC;border-bottom:1.5px solid #121212}
.cx .rk{font-family:Onest,sans-serif;font-weight:800;font-size:22px;line-height:1.25;letter-spacing:-.01em}
.cx .dd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}

/* цикл */
.cyc{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:150px 150px;row-gap:40px}
@media (max-width:760px){.stn{width:100%;max-width:none}}
.cyc-track{position:absolute;left:0;top:0;width:100%;height:340px;pointer-events:none}
.ant{stroke-dasharray:10 9;animation:ant 1.6s linear infinite}
@keyframes ant{to{stroke-dashoffset:-38}}
.stn{grid-column:var(--c);grid-row:var(--r);position:relative;z-index:1;align-self:start;justify-self:center;width:calc(100% - 24px);max-width:230px;min-height:110px;display:flex;flex-direction:column;gap:8px;padding:14px 14px 12px;border:1.5px solid #121212;background:#EDEDE8;color:#121212;cursor:pointer;font:inherit;text-align:left;transition:transform .15s,box-shadow .15s,background .15s}
.stn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #121212}
.stn:focus-visible{outline:3px solid #FF4D17;outline-offset:2px}
.stn .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stn .nd{width:34px;height:34px;border-radius:50%;border:1.5px solid #121212;display:flex;align-items:center;justify-content:center;font:800 14px Onest,sans-serif;background:#EDEDE8}
.stn .op{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.04em;color:#5A5A55}
.stn .lb{font-weight:800;font-size:15px;line-height:1.2;font-family:Onest,sans-serif}
.stn .wh{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;color:#B83A0E;letter-spacing:.04em}
.stn.done{background:#E2E2DC}
.stn.done .nd{background:#121212;color:#EDEDE8}
.stn.on{background:#FF4D17;box-shadow:6px 6px 0 #121212;transform:translate(-3px,-3px)}
.stn.on .nd{background:#121212;color:#FF4D17}
.stn.on .op,.stn.on .wh{color:#121212}
.stn.nx .op{color:#121212;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.hint{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;padding:10px 14px;background:#121212;color:#EDEDE8;font-size:14px;font-weight:600}
.hint svg{flex:none}
.lvl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border:1.5px solid #121212}
.lvl>div{padding:28px}
.lvl>div+div{border-left:1.5px solid #121212;background:#E2E2DC}
.xp{height:10px;border:1.5px solid #121212;background:#EDEDE8}
.xp i{display:block;height:100%;background:#FF4D17;transition:width .35s}
.mt{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1.5px solid #121212;font:600 13px Onest,sans-serif;background:#EDEDE8}
.base{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:18px 22px;background:#121212;color:#EDEDE8}
.base .eb{color:#FF4D17}

/* вайбкодинг */
.vc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr);gap:0;border:1.5px solid #121212}
.vc-l{padding:32px;background:#121212;color:#EDEDE8;display:flex;flex-direction:column;gap:20px}
.vc-r{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tl{display:flex;flex-direction:column;gap:10px;padding:24px;border-left:1.5px solid #121212;border-bottom:1.5px solid #121212;min-width:0}
.tl .tn{font-family:Onest,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.01em}
.tl .td{font-size:14px;line-height:1.5;color:#3D3D39}
.tl .tt{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.tl .tt span{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;padding:4px 8px;border:1px solid #121212}
.tl.hot{background:#FF4D17}
.tl.hot .td{color:#121212}
.stack{display:flex;flex-wrap:wrap;gap:8px}
.stack span{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;padding:6px 10px;border:1.5px solid #EDEDE8}

/* расчёты */
.panel{border:1.5px solid #121212;background:#E2E2DC;padding:clamp(18px,3vw,32px)}
.ttl{font-family:Onest,sans-serif;font-weight:800;font-size:22px;line-height:1.15}
.sub{font-size:13px;color:#5A5A55;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3D3D39;font-weight:600;line-height:1.3}
.field input{height:44px;border:1.5px solid #121212;border-radius:0;padding:0 12px;font:500 16px "IBM Plex Mono",monospace;color:#121212;background:#EDEDE8;width:100%}
.field input:focus{outline:3px solid #FF4D17;outline-offset:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1.5px solid #121212}
.kpi{padding:14px 14px 4px 0}
.kpi .kl{font-size:12px;color:#5A5A55;font-weight:600;font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.03em}
.kpi .kv{font-family:Onest,sans-serif;font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.kpi.acc .kv{color:#B83A0E}
.verdict{border-left:6px solid #FF4D17;padding:12px 16px;background:#EDEDE8;font-size:15px;line-height:1.55}
.mpsw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mpb{min-height:44px;padding:0 18px;border:1.5px solid #121212;background:#EDEDE8;color:#121212;font:700 14px Onest,sans-serif;cursor:pointer;border-radius:999px}
.mpb:hover{background:#E2E2DC}
.mpb.on.mp-WB{background:#A0179C;color:#FFFFFF;border-color:#A0179C}
.mpb.on.mp-OZ{background:#005BFF;color:#FFFFFF;border-color:#005BFF}
.mpb.on.mp-YM{background:#FFCC00;color:#121212;border-color:#121212}
.wf{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;min-width:620px}
.wft{position:relative;height:220px;border-bottom:1.5px solid #121212}
.wfb{position:absolute;left:0;right:0;transition:all .35s}
.wfb.total{background:#121212}
.wfb.minus{border:1.5px solid #121212;background-color:#EDEDE8;background-image:repeating-linear-gradient(135deg,rgba(18,18,18,.35) 0 1px,transparent 1px 6px)}
.wfb.ads{background:#FF4D17;border:1.5px solid #121212}
.wfb.res{background:#121212;box-shadow:inset 0 0 0 4px #FF4D17}
.wfl{font-size:12px;font-weight:600;line-height:1.25;margin-top:8px;min-height:30px}
.wfv{font-size:13px;font-weight:600}
.rc{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;height:170px;border-bottom:1.5px solid #121212}
.rcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px}
.rcol span{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;text-align:center}
.rbar{background:#121212;transition:height .35s}
.rbar.bad{background:#FF4D17;border:1.5px solid #121212}
.plan{position:absolute;left:0;right:0;border-top:2px dashed #B83A0E;pointer-events:none}
.plan span{position:absolute;right:0;top:-22px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:#B83A0E;background:#E2E2DC;padding:0 4px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:#5A5A55;text-transform:uppercase;padding:10px 12px;border-bottom:1.5px solid #121212;white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid #C9C9C1;white-space:nowrap}
table.t tr.sum td{font-weight:800;border-top:1.5px solid #121212;border-bottom:1.5px solid #121212}
table.t tr.fin td{font-weight:800;color:#B83A0E}
td.bad{color:#B83A0E;font-weight:700;background:rgba(255,77,23,.12)}
td.warn{font-weight:700;background:rgba(18,18,18,.07)}
td.good{color:#1B6B3A;font-weight:700}
td.r{text-align:right}
.note{border:1.5px solid #121212;padding:14px 16px;font-size:14px;line-height:1.5;background:#EDEDE8}
.note.bad{border-left:8px solid #FF4D17}.note.ok{border-left:8px solid #121212}.note.mid{border-left:8px solid #BDBDB5}
.fnl{display:flex;flex-direction:column;gap:6px;align-items:center}
.fst{display:flex;align-items:center;justify-content:center;height:50px;background:#121212;color:#EDEDE8;font-weight:700;font-size:14px;transition:width .4s;min-width:170px;padding:0 10px;text-align:center}
.fst.last{background:#FF4D17;color:#121212;border:1.5px solid #121212}
.fcv{font-family:"IBM Plex Mono",monospace;font-size:12px;color:#5A5A55}
.splitbar{display:flex;height:56px;border:1.5px solid #121212}
.splitbar>div{height:100%}
.sw{width:14px;height:14px;border:1.5px solid #121212;flex:none;margin-top:3px}
.fp{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:200px;border-bottom:1.5px solid #121212;min-width:560px}
.fpc{display:flex;align-items:flex-end;gap:2px;height:100%}
.fpc i{flex:1;display:block;transition:height .35s}
.fpc i.rv{background:#121212}
.fpc i.pr{background:#FF4D17;border:1.5px solid #121212}
.fpc i.ng{background:#EDEDE8;border:1.5px dashed #B83A0E}
.fpx{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;min-width:560px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#5A5A55;text-align:center;padding-top:6px}

.fmt{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0;border:1.5px solid #121212}
.fm{display:flex;flex-direction:column;gap:14px;padding:32px;min-width:0}
.fm+.fm{border-left:1.5px solid #121212}
.fm.dark{background:#121212;color:#EDEDE8}
.fm.dark .li b{color:#FF4D17}
.fmt-t{font-family:Onest,sans-serif;font-weight:900;font-size:clamp(34px,4vw,52px);line-height:1;letter-spacing:-.03em}
.fmt-p{margin:0;font-size:16px;line-height:1.55;color:#3D3D39}
@media (max-width:700px){.fm+.fm{border-left:0;border-top:1.5px solid #121212}}
/* 30 дней */
.rm{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.rm-line{position:absolute;left:28px;right:28px;top:27px;height:6px;background:#121212}
.rm-line i{position:absolute;right:0;top:0;bottom:0;width:25%;background:#FF4D17}
.wk{position:relative;display:flex;flex-direction:column;gap:14px}
.wk .wb{width:60px;height:60px;display:flex;align-items:center;justify-content:center;background:#EDEDE8;border:2px solid #121212;font:900 24px Onest,sans-serif;position:relative;z-index:1}
.wk.last .wb{background:#FF4D17;box-shadow:5px 5px 0 #121212}
.wk .wc{display:flex;flex-direction:column;gap:12px;padding:20px;border:1.5px solid #121212;background:#E2E2DC;flex:1}
.wk .wt{font-family:Onest,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.01em}
.wk .wr{margin-top:auto;padding:10px 12px;background:#121212;color:#EDEDE8;font-size:13px;font-weight:600;line-height:1.4}
.wk.last .wr{background:#FF4D17;color:#121212;border:1.5px solid #121212}

@media (max-width:980px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat+.stat{border-left:0;padding-left:0}.stat{border-top:1px solid #C9C9C1}.lvl{grid-template-columns:1fr}.lvl>div+div{border-left:0;border-top:1.5px solid #121212}.vc{grid-template-columns:1fr}.rm{grid-template-columns:repeat(2,minmax(0,1fr))}.rm-line{display:none}}
@media (max-width:760px){.cyc{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;row-gap:28px}.stn{grid-column:auto;grid-row:auto}.cyc-track{display:none}.cx{grid-template-columns:1fr}.cx .dd{grid-template-columns:1fr}.rm{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tick-in,.ant{animation:none}}
</style>

</head>

class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(o){ Object.assign(this.state, o); schedule(); } }

function schedule(){ if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; render(); }); }
function look(path, scopes){
  const parts = path.trim().split('.');
  let base;
  for (let i = scopes.length - 1; i >= 0; i--) if (scopes[i] && parts[0] in scopes[i]) { base = scopes[i][parts[0]]; break; }
  if (base === undefined) base = vals ? vals[parts[0]] : undefined;
  for (let i = 1; i < parts.length; i++) base = base == null ? undefined : base[parts[i]];
  return base;
}
const ONE = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/;
function interp(str, scopes){ return str.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (m, p) => { const v = look(p, scopes); return v == null ? '' : String(v); }); }

  if (node.nodeType !== 1) return;

    const kind = node.dataset.sc;
    if (kind === 'for') {
      const m = ONE.exec(node.getAttribute('list') || '');
      const list = m ? look(m[1], scopes) : [];
      const as = node.getAttribute('as') || 'item';
      (list || []).forEach((item, idx) => { const sc = scopes.concat([{ [as]: item, index: idx }]); node.content.childNodes.forEach(ch => build(ch, sc, out)); });
    } else {
      const m = ONE.exec(node.getAttribute('value') || '');
      if (m && look(m[1], scopes)) node.content.childNodes.forEach(ch => build(ch, scopes, out));
    }
    return;
  }
  const el = document.createElement(node.tagName.toLowerCase() === 'svg' ? 'svg' : node.tagName);
  const isSvg = node.namespaceURI === 'http://www.w3.org/2000/svg';
  const real = isSvg ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
  let selVal;
  for (const a of Array.from(node.attributes)) {
    const name = a.name, v = a.value;
    if (name.startsWith('hint-')) continue;
    const m = ONE.exec(v);
    if (/^on[a-z]/i.test(name) && m) {

      if (typeof fn === 'function') real.addEventListener(name.slice(2).toLowerCase(), fn);
      continue;
    }
    const val = v.indexOf('{{') >= 0 ? interp(v, scopes) : v;
    if (name === 'value' && (node.tagName === 'SELECT' || node.tagName === 'INPUT')) selVal = val;
    real.setAttribute(name, val);
  }
  node.childNodes.forEach(ch => build(ch, scopes, real));
  if (selVal !== undefined) { real.value = selVal; }
  out.appendChild(real);
}
function render(){
  vals = comp.renderVals();

  app.replaceChildren(frag);
  if (actIdx >= 0) { const inp = app.querySelectorAll('input')[actIdx]; if (inp) inp.focus(); }
}

    };

    // маркетинговый план
    const mO = Number(s.mOrders) || 0, mC = Number(s.mCheck) || 0, mCtr = (Number(s.mCtr) || 0) / 100, mCart = (Number(s.mCart) || 0) / 100, mOrd = (Number(s.mOrd) || 0) / 100, mD = Number(s.mDrr) || 0, mT = Number(s.mTest) || 0;
    const carts = mOrd > 0 ? mO / mOrd : 0;
    const clicks = mCart > 0 ? carts / mCart : 0;
    const imps = mCtr > 0 ? clicks / mCtr : 0;
    const cpo = mC * mD / 100;
    const bDay = mO * cpo;
    const bBase = bDay * 30, bTot = bBase * (1 + mT / 100);
    const cpcM = clicks > 0 ? bDay / clicks : 0;
    const funnel = [['Показы в день', imps, 100, 'шкала условная'], ['Клики', clicks, 74, 'CTR ' + this.pct(mCtr * 100)], ['Корзины', carts, 52, 'в корзину ' + this.pct(mCart * 100)], ['Заказы', mO, 36, 'в заказ ' + this.pct(mOrd * 100)]].map((f, i) => ({ label: f[0], val: this.fmt(f[1]), w: f[2], conv: (i ? '↓ ' : '') + f[3], cls: i === 3 ? 'fst last' : 'fst' }));
    const CH = {
      WB: [['Поиск, оплата за клики', 50, '#A0179C'], ['Каталог и рекомендации, оплата за показы', 30, '#121212'], ['Внешний трафик', 10, '#BDBDB5'], ['Тесты новых связок', 0, '#FF4D17']],
      OZ: [['Оплата за клик', 45, '#005BFF'], ['Оплата за заказ', 35, '#121212'], ['Внешний трафик', 10, '#BDBDB5'], ['Тесты новых связок', 0, '#FF4D17']],
      YM: [['Буст продаж, оплата за продажу', 60, '#B58F00'], ['Буст показов', 20, '#121212'], ['Внешний трафик', 10, '#BDBDB5'], ['Тесты новых связок', 0, '#FF4D17']]
    };
    const chs = CH[mk].map(c => c.slice());
    const baseShare = chs.slice(0, 3).reduce((a, c) => a + c[1], 0);
    const channels = chs.map((c, i) => { const sum = i < 3 ? bBase * c[1] / baseShare : bTot - bBase; return { label: c[0], w: bTot > 0 ? (sum / bTot * 100).toFixed(1) : 0, sum: this.fmt(sum) + ' ₽', bg: c[2] }; });
    const mkv = { orders: s.mOrders, check: s.mCheck, ctr: s.mCtr, cart: s.mCart, ord: s.mOrd, drr: s.mDrr, test: s.mTest, cpo: this.fmt(cpo) + ' ₽', cpc: cpcM.toFixed(1).replace('.', ',') + ' ₽', month: this.mln(bTot), rev: this.mln(mO * mC * 30), channels: channels, verdict: 'Чтобы получать ' + mO + ' рекламных заказов в день на ' + MK[mk] + ', нужно около ' + this.fmt(clicks) + ' кликов и ' + this.fmt(imps) + ' показов. Клик дороже ' + cpcM.toFixed(1).replace('.', ',') + ' ₽ уже съедает маржу. Через неделю сверяю факт с планом и перекладываю деньги в окупаемые форматы.' };

    // финплан
    const SC = { low: ['Осторожный', 0.03], base: ['Базовый', 0.07], high: ['Оптимистичный', 0.12] };
    const g = SC[s.fScen][1];
    const MPF = { WB: 38, OZ: 36, YM: 32 };
    const fRev = Number(s.fRev) || 0, fCogs = (Number(s.fCogs) || 0) / 100, fMpf = (s.fMpf === '' ? MPF[mk] : Number(s.fMpf) || 0) / 100, fDrr = (Number(s.fDrr) || 0) / 100, fTax = (Number(s.fTax) || 0) / 100, fFixed = Number(s.fFixed) || 0, fTurn = Number(s.fTurn) || 0;
    const months = [];
    let yR = 0, yP = 0;
    for (let m = 0; m < 12; m++) {
      const rv = fRev * Math.pow(1 + g, m);
      const cg = rv * fCogs, mf = rv * fMpf, ad = rv * fDrr, tx = rv * fTax;
      const pr = rv - cg - mf - ad - tx - fFixed;
      yR += rv; yP += pr;
      months.push({ rv: rv, cg: cg, mf: mf, ad: ad, tx: tx, pr: pr });
    }
    const maxR = Math.max.apply(null, months.map(x => x.rv).concat([1]));
    const fpCols = months.map((x, i) => ({ m: 'М' + (i + 1), hr: (x.rv / maxR * 100).toFixed(1), hp: (Math.abs(x.pr) / maxR * 100).toFixed(1), pc: x.pr >= 0 ? 'pr' : 'ng' }));
    const fpRows = months.map((x, i) => ({ m: 'Месяц ' + (i + 1), rev: this.fmt(x.rv), cogs: this.fmt(x.cg), mpf: this.fmt(x.mf), ads: this.fmt(x.ad), tax: this.fmt(x.tx), fixed: this.fmt(fFixed), profit: this.fmt(x.pr), pCls: x.pr < 0 ? 'bad' : 'good' }));
    const wc = months[11].cg * fTurn / 30;
    const fpv = { rev: s.fRev, cogs: s.fCogs, mpf: s.fMpf === '' ? MPF[mk] : s.fMpf, drr: s.fDrr, tax: s.fTax, fixed: s.fFixed, turn: s.fTurn, yRev: this.mln(yR), yProfit: this.mln(yP), roi: yR > 0 ? this.pct(yP / yR * 100) : '0%', wc: this.mln(wc),
      verdict: SC[s.fScen][0] + ' сценарий, рост ' + Math.round(g * 100) + '% в месяц. За год выручка ' + this.mln(yR) + ', чистая прибыль ' + this.mln(yP) + '. К концу года в товаре будет лежать около ' + this.mln(wc) + ', эти деньги нужно заложить заранее, иначе рост упрётся в остатки.' };
    const scen = Object.keys(SC).map(k => ({ label: SC[k][0], cls: s.fScen === k ? 'chip on' : 'chip', go: () => this.setState({ fScen: k }) }));

    // 30 дней
    const weeks = [
      { n: '01', title: 'Аудит', items: ['Разбираю цифры за 3–6 месяцев по каждому SKU', 'Смотрю рекламу, карточки, остатки и конкурентов', 'Согласую цели по обороту, марже, ДРР и бюджету'], res: 'Картина магазина в цифрах' },
      { n: '02', title: 'План', items: ['Что усиливаем, что чиним, что выводим', 'Цели на месяц с цифрами и сроками', 'Настраиваю ежедневный контроль цифр'], res: 'Согласованный план на месяц' },
      { n: '03', title: 'Быстрые победы', items: ['Отключаю неокупаемую рекламу', 'Правлю карточки-лидеры, фото, SEO, инфографику', 'Закрываю дыры в остатках ходовых позиций'], res: 'Рост маржи без роста бюджета' },
      { n: '04', title: 'Масштаб', items: ['Перекладываю бюджет на окупаемые товары', 'Готовлю поставки и запуск новинок', 'Отчёт собственнику, что сделано и что дальше'], res: 'Система, которая работает каждый день' }
    ].map((w, i) => Object.assign(w, { cls: i === 3 ? 'wk last' : 'wk' }));

    return {
      hero,
      cases, fMp: s.fMp, onFMp: (ev) => this.setState({ fMp: ev.target.value }), toggleAll, allLabel: allOpen ? 'Свернуть все' : 'Раскрыть все',
      stations, cur, prevSt: () => this.setState({ st: (s.st + 7) % 8 }), nextSt: () => this.setState({ st: (s.st + 1) % 8 }), nextLabel: s.st === 7 ? 'Снова к аудиту' : 'Следующий этап',
      tools,
      mkBtns, tabs, mkName: MK[mk], mkShort: MKS[mk], mkNote: NOTE[mk],
      isUnit: s.tab === 'unit', isRnp: s.tab === 'rnp', isMkt: s.tab === 'mkt', isFin: s.tab === 'fin',
      uItems, uRows, wf, calc,
      onPrice: set('price'), onCost: set('cost'), onBuy: set('buy'), onTax: set('tax'), onTarget: set('target'), onCr: set('cr'),
      rnpModes: [['drop', 'Неделя с просадкой'], ['norm', 'Обычная неделя']].map(m => ({ label: m[1], cls: s.rnpMode === m[0] ? 'chip on' : 'chip', go: () => this.setState({ rnpMode: m[0] }) })),
      rnp, rnpSum, rnpNotes, fin,
      mk: mkv, funnel, onMOrders: set('mOrders'), onMCheck: set('mCheck'), onMCtr: set('mCtr'), onMCart: set('mCart'), onMOrd: set('mOrd'), onMDrr: set('mDrr'), onMTest: set('mTest'),
      fp: fpv, fpCols, fpRows, scen, onFRev: set('fRev'), onFCogs: set('fCogs'), onFMpf: set('fMpf'), onFDrr: set('fDrr'), onFTax: set('fTax'), onFFixed: set('fFixed'), onFTurn: set('fTurn'),
      weeks
    };
  }
}


comp = new Component({});
render();
if (comp.componentDidMount) comp.componentDidMount();

</script>
